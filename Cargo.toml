[package]
name    = "SANS_matrix"
version = "0.1.0"
edition = "2024"

# ─── Runtime dependencies ─────────────────────────────────────────────────────

[dependencies]

# Error handling: anyhow provides the Result<T> alias and the ? operator with
# automatic context chaining (used in every module).
anyhow = "1"

# CLI argument parser (derive macro gives us the #[derive(Parser)] struct
# with --help, --version, and typed arguments for free).
clap = { version = "4", features = ["derive"] }

# PDB file parser and writer: parse_pdb_file(), write_pdb_file(), PdbStructure,
# Atom — the entire pdb/ module is built on this crate.
# No extra feature flags are needed for the core parse/write API.
pdbrust = "0.7"

# Random number generation: StdRng, SeedableRng (d2o.rs probabilistic exchange)
# and SliceRandom::partial_shuffle (Fisher-Yates selection of labile H).
# The default feature set includes std_rng and the seq module, which is all
# we need — no extra features required.
rand = "0.8"

# Data-parallel iteration: par_iter() and ThreadPoolBuilder in pepsi/runner.rs
# for running Pepsi-SANS jobs in parallel.
rayon = "1"

# ─── Dev-only dependencies ────────────────────────────────────────────────────
# These are compiled only when running `cargo test`; they are absent from the
# release binary.

[dev-dependencies]

# Temporary files and directories for unit tests (parser.rs, d2o.rs, etc.).
# NamedTempFile and TempDir are used extensively to avoid touching real paths.
tempfile = "3"

# ─── Release profile ──────────────────────────────────────────────────────────
# Applied when building with `cargo build --release`.

[profile.release]

# Maximum optimisation level: enables auto-vectorisation, loop unrolling,
# and inlining across function boundaries — important for the tight f32 loops
# in output/matrix.rs and the hot pepsi parsing paths.
opt-level = 3

# Link-Time Optimisation: the linker can inline and optimise across compilation
# units (e.g. between main.rs and pepsi/runner.rs). Makes the binary smaller
# and faster at the cost of longer link time.
lto = true

# One codegen unit means LLVM sees the whole crate at once, enabling the best
# cross-module optimisations. Compile time increases; runtime decreases.
codegen-units = 1

# Strip debug symbols from the release binary to reduce its size on disk.
# Remove this line if you need `perf` or `flamegraph` profiling on release builds.
strip = true

# ─── Dev profile tweaks ───────────────────────────────────────────────────────
# Applied for `cargo build` (no --release) and `cargo test`.

[profile.dev]

# Level 1 optimisation in dev mode: avoids pathologically slow debug builds
# (especially important for rayon's parallel iterator machinery and pdbrust's
# parser, which are very slow at opt-level=0).
opt-level = 1